name: CI

# Her push/PR'da koşar (yalnızca cars.json değişen yayın commit'leri dahil):
# hafif ama koruyucu doğrulama. Ağır işler (E2E + Lighthouse) ci-heavy.yml'de
# ve yalnızca kod değiştiğinde koşar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # Yerel geliştirme ortamıyla aynı sürüm (npm 11 kilit çözümlemesi)
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Birim testler
        run: npm test

      # Build; içinde validate-cars çalışır (bozuk cars.json'ı burada yakalar).
      - name: Build
        run: npm run build
